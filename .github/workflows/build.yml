name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run build
        env:
          # Avoid interactive prompts; skip code signing for public CI builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List dist artifacts
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelLyrics-windows
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/**/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/dist/PixelLyrics-Setup-*.exe
            app/dist/PixelLyrics-portable-*.exe
            app/dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
